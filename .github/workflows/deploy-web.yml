name: Deploy MissionLink Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for firmware build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build official XIAO ESP32-S3 firmware
        run: pio run -e xiao_esp32s3
      - name: Stage default flasher binaries
        run: |
          mkdir -p web/firmware
          cp .pio/build/xiao_esp32s3/bootloader.bin web/firmware/bootloader.bin
          cp .pio/build/xiao_esp32s3/partitions.bin web/firmware/partitions.bin
          cp .pio/build/xiao_esp32s3/firmware.bin web/firmware/firmware.bin
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" web/firmware/boot_app0.bin
          test -s web/firmware/bootloader.bin
          test -s web/firmware/partitions.bin
          test -s web/firmware/firmware.bin
          test -s web/firmware/boot_app0.bin
      - name: Validate required web app files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/icon.svg
          node --check web/app.js
          node --check web/sw.js
          node --check web/flasher.js
          node --check web/flasher-validate.js
          node --test web/tests/flasher-validate.test.mjs
          python3 -m json.tool web/manifest.webmanifest > /dev/null
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
