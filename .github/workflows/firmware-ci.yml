name: MissionLink Firmware CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "platformio.ini"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "platformio.ini"
      - ".github/workflows/firmware-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run packet codec and mesh routing tests
        run: pio test -e native
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile ESP32-S3 firmware scaffold
        run: pio run -e xiao_esp32s3
      - name: Stage complete flash set
        run: |
          mkdir -p dist/missionlink-firmware
          cp .pio/build/xiao_esp32s3/bootloader.bin dist/missionlink-firmware/
          cp .pio/build/xiao_esp32s3/partitions.bin dist/missionlink-firmware/
          cp .pio/build/xiao_esp32s3/firmware.bin dist/missionlink-firmware/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" dist/missionlink-firmware/
      - name: Upload flash-ready firmware set
        uses: actions/upload-artifact@v4
        with:
          name: missionlink-firmware-${{ github.sha }}
          path: dist/missionlink-firmware/
          if-no-files-found: error
          retention-days: 14
