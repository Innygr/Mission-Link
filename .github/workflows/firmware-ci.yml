name: MissionLink Firmware CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "platformio.ini"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "platformio.ini"
      - ".github/workflows/firmware-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run packet codec tests
        run: pio test -e native
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile ESP32-S3 firmware scaffold
        run: pio run -e xiao_esp32s3
