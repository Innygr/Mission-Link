[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib
  h2zero/NimBLE-Arduino
build_flags =
  -D MISSIONLINK_VERSION=\"0.1.0\"

[env:native]
platform = native
build_flags = -std=c++17 -I include
test_build_src = yes
